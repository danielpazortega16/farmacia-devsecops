<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmacia La Esperanza - Pedidos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 900px">
  <h3>Farmacia La Esperanza</h3>
  <p class="text-muted">Registro de pedidos de WhatsApp</p>

  <div class="mb-3">
    <label class="form-label">Llave de acceso</label>
    <input id="llave" type="password" class="form-control" style="max-width: 300px">
  </div>
  <button class="btn btn-secondary btn-sm mb-3" onclick="cargarProductos()">Cargar productos</button>

  <table class="table table-sm table-bordered bg-white">
    <thead><tr><th>Producto</th><th>Precio</th><th>Hay</th><th>Receta</th><th style="width: 90px">Cantidad</th></tr></thead>
    <tbody id="productos"></tbody>
  </table>

  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <label class="form-label">Teléfono del cliente</label>
      <input id="telefono" class="form-control" placeholder="55123456">
    </div>
    <div class="col-md-4">
      <label class="form-label">Forma de pago</label>
      <select id="pago" class="form-select">
        <option value="efectivo">Efectivo</option>
        <option value="transferencia">Transferencia</option>
        <option value="tarjeta">Tarjeta</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">No. de receta (si lleva controlado)</label>
      <input id="receta" class="form-control" placeholder="MS-123456">
    </div>
  </div>
  <button class="btn btn-primary" onclick="registrar()">Registrar pedido</button>

  <div id="resultado" class="mt-3"></div>
</div>

<script>
function llave() {
  return { "X-API-Key": document.getElementById("llave").value, "Content-Type": "application/json" };
}

function mostrar(tipo, texto) {
  document.getElementById("resultado").innerHTML = "";
  const div = document.createElement("div");
  div.className = "alert alert-" + tipo;
  div.textContent = texto;
  document.getElementById("resultado").appendChild(div);
}

async function cargarProductos() {
  const r = await fetch("/api/v1/productos", { headers: llave() });
  if (!r.ok) return mostrar("danger", "Llave incorrecta");
  const productos = await r.json();
  const tbody = document.getElementById("productos");
  tbody.innerHTML = "";
  for (const p of productos) {
    const tr = document.createElement("tr");
    for (const v of [p.nombre, "Q" + p.precio, p.existencias, p.requiere_receta ? "Sí" : ""]) {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    }
    const td = document.createElement("td");
    td.innerHTML = '<input type="number" min="0" value="0" class="form-control form-control-sm">';
    td.firstChild.dataset.codigo = p.codigo;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

async function registrar() {
  const items = [...document.querySelectorAll("#productos input")]
    .filter(i => Number(i.value) > 0)
    .map(i => ({ codigo: i.dataset.codigo, cantidad: Number(i.value) }));
  const pedido = {
    telefono: document.getElementById("telefono").value,
    items: items,
    metodo_pago: document.getElementById("pago").value,
  };
  const receta = document.getElementById("receta").value.trim();
  if (receta) pedido.numero_receta = receta;
  if (pedido.metodo_pago === "tarjeta") pedido.token_tarjeta = "tok_demo12345678";

  const r = await fetch("/api/v1/ventas", { method: "POST", headers: llave(), body: JSON.stringify(pedido) });
  const datos = await r.json();
  if (r.ok) {
    mostrar("success", "Pedido #" + datos.id + " registrado. Total a cobrar: Q" + datos.total);
    cargarProductos();
  } else if (r.status === 422) {
    mostrar("warning", "Revise los datos: teléfono de 8 dígitos, al menos un producto y receta con formato MS-123456");
  } else {
    mostrar("danger", datos.detail);
  }
}
</script>
</body>
</html>
