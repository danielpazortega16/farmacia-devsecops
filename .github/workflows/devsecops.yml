name: pipeline-devsecops

on:
  push:
    branches: [main, "demo/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Buscar llaves y contraseñas en todo el historial
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo -v --redact --log-opts="HEAD"

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Pruebas con cobertura (minimo 90 %)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.180.0
      - name: Analisis estatico
        run: semgrep scan --config p/python --config p/owasp-top-ten --severity ERROR --severity WARNING --error app

  sca:
    name: Trivy (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Descargar base de vulnerabilidades
        run: bash .github/scripts/trivy-db.sh
      - name: Dependencias con CVE alto o critico
        run: >
          docker run --rm -v trivy-cache:/root/.cache -v "$PWD:/src" aquasec/trivy:0.58.1
          fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src

  build-despliegue:
    name: Imagen, despliegue y DAST
    needs: [secretos, pruebas, sast, sca]
    # solo main llega a desplegarse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGEN: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t "${IMAGEN,,}" .
      - name: Descargar base de vulnerabilidades
        run: bash .github/scripts/trivy-db.sh
      - name: Escanear la imagen
        run: >
          docker run --rm -v trivy-cache:/root/.cache -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --skip-db-update --severity CRITICAL --exit-code 1 --ignore-unfixed "${IMAGEN,,}"
      - name: Inventario de componentes (SBOM)
        run: |
          mkdir -p reportes && chmod 777 reportes
          docker run --rm -v trivy-cache:/root/.cache -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reportes:/out" aquasec/trivy:0.58.1 \
            image --skip-db-update --format cyclonedx --output /out/sbom.cdx.json "${IMAGEN,,}"
      - name: Publicar en GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGEN,,}"
      - name: Desplegar en entorno de pruebas
        run: |
          docker run -d --name farmacia -p 8000:8000 -e API_KEY="${{ secrets.API_KEY_STAGING || 'staging-demo' }}" "${IMAGEN,,}"
          for i in $(seq 1 15); do curl -fs localhost:8000/salud && break; sleep 2; done
      - name: Prueba de humo
        run: |
          curl -fs localhost:8000/salud
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/productos)" = "401"
      - name: DAST con OWASP ZAP
        run: |
          cp .zap/reglas.tsv reportes/
          docker run --rm --network host -v "$PWD/reportes:/zap/wrk" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:8000 -c reglas.tsv -r zap.html -J zap.json -I
      - name: Bitacora del contenedor
        if: always()
        run: docker logs farmacia || true
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-${{ github.sha }}
          path: reportes/
